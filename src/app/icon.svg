<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Seamless Dark Rounded Rect Background (Zero White Borders) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Outer Accent Ring -->
  <rect x="12" y="12" width="488" height="488" rx="120" fill="none" stroke="url(#cupGrad)" stroke-width="4" opacity="0.3" />

  <g filter="url(#glow)">
    <!-- Glowing Steam Lines -->
    <path d="M 216 150 C 200 120, 240 100, 224 70" fill="none" stroke="url(#cupGrad)" stroke-width="12" stroke-linecap="round" />
    <path d="M 256 160 C 240 125, 280 105, 264 65" fill="none" stroke="url(#cupGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 296 150 C 280 120, 320 100, 304 70" fill="none" stroke="url(#cupGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Tea Cup Main Body -->
    <path d="M 128 210 L 384 210 C 375 340, 325 380, 256 380 C 187 380, 137 340, 128 210 Z" fill="none" stroke="url(#cupGrad)" stroke-width="22" stroke-linejoin="round" />
    
    <!-- Tea Cup Rim -->
    <ellipse cx="256" cy="210" rx="128" ry="24" fill="none" stroke="url(#cupGrad)" stroke-width="18" />

    <!-- Tea Cup Handle -->
    <path d="M 376 230 C 440 230, 440 320, 360 330" fill="none" stroke="url(#cupGrad)" stroke-width="20" stroke-linecap="round" />

    <!-- Saucer Base -->
    <path d="M 140 410 Q 256 430 372 410" fill="none" stroke="url(#cupGrad)" stroke-width="18" stroke-linecap="round" />

    <!-- Sparkle Stars -->
    <path d="M 170 120 L 174 132 L 186 136 L 174 140 L 170 152 L 166 140 L 154 136 L 166 132 Z" fill="#38bdf8" />
    <path d="M 342 120 L 346 132 L 358 136 L 346 140 L 342 152 L 338 140 L 326 136 L 338 132 Z" fill="#c084fc" />
  </g>
</svg>
